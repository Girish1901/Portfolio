(function(){
  const svg=document.getElementById('viz'),NS='http://www.w3.org/2000/svg',C=24,R=10,W=600,H=320,gx=W/C,gy=H/R;
  const hs=[3,4,3,5,4,6,5,5,7,6,8,7,6,8,7,8,9,8,9,8,9,9,8,10],all=[],lit=[],dim=[];
  for(let c=0;c<C;c++)for(let r=0;r<R;r++){
    const e=document.createElementNS(NS,'circle'),on=r<hs[c];
    e.setAttribute('r',4);e.setAttribute('fill','#9A9AA6');e.setAttribute('opacity',.45);
    e.setAttribute('cx',Math.random()*W);e.setAttribute('cy',Math.random()*H);
    e._x=c*gx+gx/2;e._y=H-(r*gy+gy/2);e._c=c;e._r=r;e._top=on&&r===hs[c]-1&&hs[c]>=9;
    svg.appendChild(e);all.push(e);(on?lit:dim).push(e);
  }
  const st=[...document.querySelectorAll('.stages span')],set=i=>st.forEach((s,k)=>s.classList.toggle('on',k===i));
  if(still||!window.anime){all.forEach(e=>{e.setAttribute('cx',e._x);e.setAttribute('cy',e._y)});lit.forEach(e=>{e.setAttribute('fill',e._top?'#FF2A8A':'#007BA7');e.setAttribute('opacity',1)});dim.forEach(e=>e.setAttribute('opacity',.12));set(2);return}
  set(0);setTimeout(()=>set(1),1500);setTimeout(()=>set(2),3300);
  anime.timeline({easing:'easeOutExpo'})
   .add({targets:all,cx:e=>e._x,cy:e=>e._y,duration:1800,delay:anime.stagger(5,{from:'center'})},700)
   .add({targets:lit,fill:e=>e._top?'#FF2A8A':'#007BA7',opacity:1,r:5,duration:900,delay:e=>e._c*35+e._r*12},2500)
   .add({targets:dim,opacity:.12,duration:700},2500);
})();

 points:['Cleaned a dataset of approximately 1,000 IMDb titles (source: IMDb via Kaggle).','Handled missing values and duplicate records.','Converted revenue values to INR using the chosen conversion assumptions.','Analysed revenue by year and genre.','Explored rating distributions and correlations.'],

 images:[{src:'img/cin1.jpg',alt:'Average revenue by year'},{src:'img/cin2.jpg',alt:'Top 10 genres by average revenue'},{src:'img/cin3.jpg',alt:'Engagement tier counts'}],
 github:'https://github.com/Girish1901/Movie-Analytics',note:''}],
sections:[],
contacts:[{label:'Email Me',url:'mailto:girish.t2004@gmail.com',primary:true},{label:'View Resume',url:'Girish_T_Resume.pdf'},{label:'LinkedIn',url:'https://www.linkedin.com/in/girish-t-417467283'},{label:'GitHub',url:'https://github.com/Girish1901'}]
};

let C=structuredClone(DEFAULT);

/* merge: API can override profile/texts/hide/sections/projects/skills/contacts. */
const merge=j=>{
  if(!j||typeof j!=='object'||!Object.keys(j).length) return DEFAULT;
  return {
    ...DEFAULT,
    ...j,
    profile:{...DEFAULT.profile,...(j.profile||{})},
    texts:{...DEFAULT.texts,...(j.texts||{})},
    hide:{...DEFAULT.hide,...(j.hide||{})},
    skills:(Array.isArray(j.skills)&&j.skills.length)?j.skills:DEFAULT.skills,
    projects:(Array.isArray(j.projects)&&j.projects.length)?j.projects:DEFAULT.projects,
    contacts:(Array.isArray(j.contacts)&&j.contacts.length)?j.contacts:DEFAULT.contacts,
    sections:(Array.isArray(j.sections))?j.sections:DEFAULT.sections
  };
};

const $=id=>document.getElementById(id),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const safeUrl=u=>{try{const x=new URL(u,location.href);return/^(https?:|mailto:|tel:)$/.test(x.protocol)?u:null}catch{return null}};
const safeImg=u=>/^(https:\/\/|http:\/\/|img\/)/.test(u||'')?u:'';
if(!window.anime)window.anime=o=>{const t=o.targets;if(t&&'v' in t){t.v=o.v;o.update&&o.update()}else if(t&&t.style&&o.strokeDashoffset!==undefined)t.style.strokeDashoffset=o.strokeDashoffset};
const io=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;io.unobserve(en.target);const t=en.target;
  if(t.classList.contains('layer'))t.classList.add('in');
  const n=t.querySelector('[data-count]');
  if(n){const o={v:0},d=+n.dataset.dec||0,f=()=>n.textContent=(n.dataset.prefix||'')+o.v.toFixed(d)+(n.dataset.suffix||'');anime({targets:o,v:+n.dataset.count,duration:still?1:1600,easing:'easeOutExpo',update:f,complete:f})}
  const ring=t.querySelector('.ring');if(ring)anime({targets:ring,strokeDashoffset:251.3*(1-Math.min(1,(+ring.dataset.v||0)/100)),duration:still?1:1800,easing:'easeOutCubic'});
}),{threshold:.35});
const lb=$('lb');let cur=[],ci=0;
function show(){const i=lb.querySelector('img');i.src=cur[ci][0];i.alt=cur[ci][1];lb.querySelector('.t').textContent=cur[ci][1]+' ('+(ci+1)+'/'+cur.length+')'}
lb.querySelector('.pv').onclick=()=>{ci=(ci+cur.length-1)%cur.length;show()};
lb.querySelector('.nx').onclick=()=>{ci=(ci+1)%cur.length;show()};
lb.querySelector('.cl').onclick=()=>lb.close();
lb.addEventListener('click',e=>{if(e.target===lb)lb.close()});

function renderAll(){
  const p=C.profile,t=C.texts;
  document.title=p.name+' \u2013 Data Analyst \u00b7 SQL, Power BI, Python';
  $('logo').textContent=p.name;
  $('h1').replaceChildren(p.name,el('span','',p.headline));
  $('sum').textContent=p.summary;
  $('stT').textContent=t.stackTitle;$('stL').textContent=t.stackLede;
  $('wkT').textContent=t.workTitle;
  $('ctT').textContent=t.contactTitle;$('ctL').textContent=t.contactLede;
  $('sig').textContent='\u00a9 2026 '+p.name+(p.location?' \u00b7 '+p.location:'');
  $('stack').hidden=!!C.hide.stack;$('nS').hidden=!!C.hide.stack;
  $('work').hidden=!!C.hide.work;$('nW').hidden=!!C.hide.work;

  /* Skill layers */
  const lay=$('layers');lay.replaceChildren();
  C.skills.forEach(g=>{const d=el('div','layer'),h=el('div');
    d.style.setProperty('--c',/^#[0-9a-f]{3,8}$/i.test(g.color||'')?g.color:'#007BA7');
    h.append(el('h3','',g.name),el('small','',g.sub||''));
    const u=el('ul','chips');(g.items||[]).forEach(x=>u.append(el('li','',x)));
    d.append(h,u);lay.append(d);io.observe(d)});

  /* Currently Learning */
  const cl=$('currLearn');cl.replaceChildren();
  if(t.stackLearning){
    const box=el('div','curr-learn');
    const lbl=el('span','curr-learn-label','Currently Learning');
    const chips=el('div','curr-learn-chips');
    t.stackLearning.split('\u00b7').forEach(s=>{const sp=el('span','',s.trim());chips.append(sp)});
    box.append(lbl,chips);cl.append(box);
  }

  /* Projects */
  const pj=$('projects');pj.replaceChildren();
  C.projects.forEach(q=>{
    const a=el('article','proj'),L=el('div'),R=el('div');
    const n=el('div','big'+(q.rose?' r':''),'0');
    n.dataset.count=q.big||0;n.dataset.dec=q.dec||0;n.dataset.suffix=q.suf||'';n.dataset.prefix=q.pre||'';
    L.append(n,el('div','cap',q.cap||''));
    if(q.ring){L.insertAdjacentHTML('beforeend','<svg class="donut" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" stroke="#26262d"/><circle class="ring" cx="50" cy="50" r="40" stroke="#FF2A8A" stroke-linecap="round" transform="rotate(-90 50 50)" stroke-dasharray="251.3" stroke-dashoffset="251.3"/></svg>');L.querySelector('.ring').dataset.v=q.big;}
    /* KPI cards (left column for e-commerce) */
    if(q.kpis&&q.kpis.length){const kr=el('div','kpi-row');q.kpis.forEach(k=>{const kc=el('div','kpi-card');kc.append(el('div','kv',k.kv),el('div','kl',k.kl));kr.append(kc)});L.append(kr)}

    R.append(el('h3','',q.title),el('div','tools',q.tools||''));
    /* Business Problem */
    if(q.businessProblem){R.append(el('p','sect-lbl','Business Problem'),el('p','biz-text',q.businessProblem))}
    /* What I Built */
    R.append(el('p','sect-lbl','What I Built'));
    const ul=el('ul');(q.points||[]).forEach(x=>ul.append(el('li','',x)));R.append(ul);
    /* Key Business Questions */
    if(q.questions&&q.questions.length){R.append(el('p','sect-lbl','Key Business Questions'));const ql=el('ul','qs');q.questions.forEach(x=>ql.append(el('li','',x)));R.append(ql)}
    /* Finding */
    if(q.finding)R.append(el('p','find',q.finding));
    /* Business Value */
    if(q.businessValue)R.append(el('p','biz-val',q.businessValue));
    /* Images */
    const imgs=(q.images||[]).filter(i=>safeImg(i.src)),sh=el('div','shots');let mb;
    imgs.forEach((g,i)=>{const b=el('button',i?'':'main'),im=new Image();im.src=g.src;im.alt=g.alt||'';im.loading='lazy';b.append(im);b.setAttribute('aria-label','Enlarge: '+(g.alt||q.title));
      b.onclick=()=>{cur=imgs.map(x=>[x.src,x.alt||'']);ci=i;show();lb.showModal()};if(i)sh.append(b);else mb=b});
    if(mb)R.append(mb);R.append(sh);
    /* Buttons */
    const pb=el('div','proj-btns');
    const gh=safeUrl(q.github);
    if(gh){const l=el('a','','View Code on GitHub');l.href=gh;l.target='_blank';l.rel='noopener';pb.append(l)}
    const extraLinks = (q.extraLinks && q.extraLinks.length) ? q.extraLinks : (q.caseStudyUrl ? [{label:'View Full Case Study', url:q.caseStudyUrl, primary:true}] : []);
    extraLinks.forEach(lk=>{const u=safeUrl(lk.url);if(!u)return;const l=el('a',lk.primary?'p':'',lk.label);l.href=u;if(/^https?:/.test(u)){l.target='_blank';l.rel='noopener'}pb.append(l)});
    if(pb.children.length)R.append(pb);
    if(q.note)R.append(el('p','cap-note',q.note));
    a.append(L,R);pj.append(a);io.observe(a);
  });

  /* Extra sections */
  const ex=$('extra');ex.replaceChildren();
  C.sections.forEach(s=>{const sec=el('section','x'),w=el('div','wrap');w.append(el('h2','',s.title),el('p','lede',s.body));sec.append(w);ex.append(sec)});

  /* Contact links */
  const lk=$('links');lk.replaceChildren();
  C.contacts.forEach(c=>{const u=safeUrl(c.url);if(!u)return;
    const a=el('a','btn'+(c.primary?' p':''),c.label);a.href=u;
    if(/^https?:/.test(u)){a.target='_blank';a.rel='noopener'}
    if(/\.pdf$/i.test(u)){a.target='_blank';a.rel='noopener'}
    lk.append(a)});
}
renderAll();

/* Admin panel — window.PF fully active */
window.PF={get:()=>C,set:c=>{C=c;renderAll()}};

/* Private entry: five quick clicks on the footer or copyright line */
let ck=[];
function triggerAdmin(){
  const n=Date.now();ck=ck.filter(t=>n-t<2500);ck.push(n);
  if(ck.length>=5){ck=[];
    if(window.PFAdmin)return PFAdmin.open();
    const s=document.createElement('script');s.src='admin.js';s.onload=()=>PFAdmin.open();document.head.append(s);
  }
}
const sig=$('sig');if(sig)sig.onclick=triggerAdmin;
const foot=document.querySelector('footer');if(foot)foot.onclick=triggerAdmin;

/* /api/content — fetches and merges server updates */
fetch('/api/content',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
  if(j&&Object.keys(j).length>0){const m=merge(j);if(JSON.stringify(m)!==JSON.stringify(C)){C=m;renderAll()}}
}).catch(()=>{});
</script>
